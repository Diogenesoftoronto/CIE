name: Simple CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality-checks:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          echo "🔍 Running ruff linting..."
          ruff check cie/ --output-format=github

      - name: Check formatting
        run: |
          echo "🎨 Checking black formatting..."
          black --check --diff cie/

      - name: Type checking
        run: |
          echo "🔬 Running mypy type checking..."
          mypy cie/ --ignore-missing-imports || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          pytest -v --cov=cie --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [quality-checks, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: |
          echo "📦 Building package..."
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Test package installation
        run: |
          echo "🔧 Testing package installation..."
          pip install dist/*.whl
          python -c "import cie; print('✅ Package installed successfully')"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run bandit security scan
        run: |
          echo "🔒 Running bandit security scan..."
          bandit -r cie/ -f json || true

      - name: Check for known vulnerabilities
        run: |
          echo "🛡️  Checking for known vulnerabilities..."
          pip install -e ".[dev]"
          safety check --json || true

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality-checks, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          echo "🔗 Running integration tests..."
          pytest tests/test_end_to_end.py -v -m "not slow"

      - name: Test CLI functionality
        run: |
          echo "🖥️  Testing CLI functionality..."
          cie --help
          cie optimizers
          cie workloads
          cie stats

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install pdoc3

      - name: Generate documentation
        run: |
          echo "📚 Generating documentation..."
          pdoc cie/ --output-directory docs/ || true

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [quality-checks, test, build, security]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.quality-checks.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ All CI checks passed!"
            echo "CI_STATUS=success" >> $GITHUB_ENV
          else
            echo "❌ Some CI checks failed"
            echo "CI_STATUS=failure" >> $GITHUB_ENV
          fi

      - name: Create status comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = process.env.CI_STATUS;
            const emoji = status === 'success' ? '✅' : '❌';
            const body = `${emoji} CI Pipeline Status: ${status.toUpperCase()}\n\n` +
              `📊 Quality Checks: ${{ needs.quality-checks.result }}\n` +
              `🧪 Tests: ${{ needs.test.result }}\n` +
              `📦 Build: ${{ needs.build.result }}\n` +
              `🔒 Security: ${{ needs.security.result }}\n\n` +
              `🔗 [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });